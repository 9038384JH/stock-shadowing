name: 주식 쉐도잉 & ARK 추적

on:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

jobs:
  run-shadowing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "23" ]; then
            python runner.py us_and_ark
          else
            python runner.py kr
          fi
